name: Docker

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: docker.io

jobs:
  # Tests, build and dependency audit must pass before an image is built.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Detect Node projects
        id: detect
        run: |
          dirs=$(find . -maxdepth 3 -name package-lock.json -not -path '*/node_modules/*' -exec dirname {} \; | sort | tr '\n' ' ')
          echo "dirs=${dirs}" >> "$GITHUB_OUTPUT"
          echo "Node projects: ${dirs:-none}"

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.dirs != ''
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install, build, test and audit
        if: steps.detect.outputs.dirs != ''
        env:
          DIRS: ${{ steps.detect.outputs.dirs }}
        run: |
          set -euo pipefail
          for dir in $DIRS; do
            echo "::group::$dir"
            (
              cd "$dir"
              npm ci
              npm run build --if-present
              npm test --if-present
              npm audit --omit=dev --audit-level=high
            )
            echo "::endgroup::"
          done

  build:
    needs: test
    runs-on: ubuntu-latest
    environment: docker
    permissions:
      contents: read
      # id-token: write is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          # IMAGE_NAME comes from the "docker" environment variables;
          # falls back to <dockerhub user>/<repo name> if unset.
          images: ${{ vars.IMAGE_NAME || format('{0}/{1}', secrets.DOCKERHUB_USERNAME, github.event.repository.name) }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
